name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which workflow is slow, impossible or error-prone today?
      placeholder: When I mock a CRUD resource, a POST does not appear in the following GET ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Mockups and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you have tried.
  - type: dropdown
    id: scope
    attributes:
      label: Does this keep the project fully client-side?
      description: Web Mock Studio has no backend by design.
      options:
        - "Yes, it runs entirely in the browser"
        - "No, it needs a server or external service"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature.
